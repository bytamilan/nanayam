# -----------------------------------------------------------------------------
# Org console (Next.js)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: nanayam-console
  namespace: ${NANAYAM_NAMESPACE}
  labels:
    app.kubernetes.io/name: nanayam-console
    app.kubernetes.io/part-of: nanayam
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nanayam-console
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanayam-console
  namespace: ${NANAYAM_NAMESPACE}
  labels:
    app.kubernetes.io/name: nanayam-console
    app.kubernetes.io/part-of: nanayam
spec:
  replicas: ${NANAYAM_CONSOLE_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: nanayam-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanayam-console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: console
          image: ${NANAYAM_CONSOLE_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # In-cluster traffic reaches the gateway by service DNS; only the
            # browser-facing URL needs to be externally resolvable.
            - name: GATEWAY_URL
              value: "http://nanayam-gateway.${NANAYAM_NAMESPACE}.svc.cluster.local:8080"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: "${NANAYAM_PUBLIC_GATEWAY_URL}"
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
