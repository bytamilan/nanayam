# CA Docker Compose Template
# Generated by nanayam node init --type ca
version: "3.7"

volumes:
  ca_{{.OrgNameLower}}:

networks:
  nanayam:
    name: nanayam

services:
  ca_{{.OrgNameLower}}:
    image: hyperledger/fabric-ca:1.5.12
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-{{.OrgNameLower}}
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT={{.CAPort}}
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:{{.OpsPort}}
    ports:
      - "{{.CAPort}}:{{.CAPort}}"
      - "{{.OpsPort}}:{{.OpsPort}}"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ca_{{.OrgNameLower}}:/etc/hyperledger/fabric-ca-server
    container_name: ca_{{.OrgNameLower}}
    networks:
      - nanayam
