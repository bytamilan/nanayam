name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
      - 'scripts/wiki-to-github-wiki.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate wiki source
        run: python3 scripts/check-wiki.py

      - name: Publish to the GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          wiki_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # A repository's wiki git remote does not exist until the wiki has
          # been created — Wikis enabled in Settings and one page saved. Until
          # then this is a configuration gap, not a build failure, so report it
          # and stop rather than failing every push to main.
          #
          # Only that specific case is skipped. An auth failure, a network
          # blip, or a GitHub outage must fail loudly: treating them as "not
          # initialised" would exit 0, print setup steps that are not the real
          # problem, and leave the wiki silently stale.
          if ! ls_remote_output=$(git ls-remote "$wiki_url" 2>&1); then
            # Scrub the URL: the error text echoes it back, token and all.
            ls_remote_output=${ls_remote_output//"$GITHUB_TOKEN"/***}

            if ! printf '%s' "$ls_remote_output" | grep -qi "repository not found"; then
              echo "Could not reach the wiki remote, and it is not a missing-wiki error:" >&2
              printf '%s\n' "$ls_remote_output" >&2
              exit 1
            fi

            {
              echo "### Wiki not initialised"
              echo
              echo "\`${GITHUB_REPOSITORY}.wiki.git\` does not exist yet, so there was nothing to publish to."
              echo
              echo "To enable this workflow, once:"
              echo "1. Settings → Features → tick **Wikis**"
              echo "2. Open the Wiki tab and save any page (its content is overwritten on the next run)"
              echo
              echo "The same documentation is already published to GitHub Pages regardless:"
              echo "https://bytamilan.github.io/nanayam/"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Wiki not initialised; skipping publish."
            exit 0
          fi

          git clone "$wiki_url" wiki

          # Convert the Pages-flavoured source into wiki-flavoured pages: strip
          # the Jekyll front matter and turn Page.html links back into the
          # extensionless form GitHub Wiki resolves.
          python3 scripts/wiki-to-github-wiki.py docs/wiki wiki

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi

          git commit -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git push
