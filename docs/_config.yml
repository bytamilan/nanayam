# GitHub Pages configuration for the Nanayam documentation site.
#
# The site is built and deployed by .github/workflows/deploy-docs.yml (GitHub
# Actions as the Pages source, not the classic "Deploy from a branch" build),
# so this directory only needs to be the Jekyll source root: it is built with
# `jekyll build` from within `docs/`, and https://bytamilan.github.io/nanayam/
# maps to docs/index.md. One-time repo setting required: Settings → Pages →
# Build and deployment → Source → "GitHub Actions".
title: Nanayam
description: A private, permissioned Web3 ledger on Hyperledger Fabric — documented in English and தமிழ்.
url: https://bytamilan.github.io
baseurl: /nanayam

# A local layout rather than a theme gem: it renders identically with a plain
# `jekyll build` and on GitHub Pages, so the site can be verified before it
# ships.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude paths are relative to this directory, so the wiki's README needs its
# full path: it documents the source directory and is not a page of the site.
exclude:
  - wiki/README.md
  - Gemfile
  - Gemfile.lock
  - vendor
