# Peer Docker Compose Template
# Generated by nanayam node init --type peer
version: "3.7"

volumes:
  {{.PeerID}}:

networks:
  nanayam:
    name: nanayam

services:
  {{.PeerID}}:
    container_name: {{.PeerID}}
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=nanayam
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID={{.PeerID}}
      - CORE_PEER_ADDRESS={{.PeerID}}:{{.PeerPort}}
      - CORE_PEER_LISTENADDRESS=0.0.0.0:{{.PeerPort}}
      - CORE_PEER_CHAINCODEADDRESS={{.PeerID}}:{{.ChaincodePort}}
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:{{.ChaincodePort}}
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT={{.PeerID}}:{{.PeerPort}}
      - CORE_PEER_LOCALMSPID={{.MSPID}}
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:{{.OpsPort}}
      - CORE_METRICS_PROVIDER=prometheus
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - {{.CryptoPath}}/peers/{{.PeerID}}/msp:/etc/hyperledger/fabric/msp
      - {{.CryptoPath}}/peers/{{.PeerID}}/tls:/etc/hyperledger/fabric/tls
      - {{.PeerID}}:/var/hyperledger/production
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    ports:
      - {{.PeerPort}}:{{.PeerPort}}
      - {{.OpsPort}}:{{.OpsPort}}
    networks:
      - nanayam
